services:
  entertainment:
    container_name: skeleton-entertainment
    image: alpine:latest
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
    command: >
      sh -c 'while true; do
        echo "[$$( date )] Heartbeat — entertainment-personal stack is alive";
        sleep 60;
      done'
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 5s
      retries: 3

  monkeytype:
    container_name: MonkeyType
    image: themythologist/monkeytype:frontend-latest
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    ports:
      - "5001:5000"
    mem_limit: 100M
    cpus: 0.25
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
networks:
  proxy:
    name: proxy
    external: true
