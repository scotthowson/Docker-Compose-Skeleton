services:
  whoami:
    container_name: skeleton-whoami
    image: traefik/whoami
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
    ports:
      - "8084:80"


  docker-socket-proxy:
    container_name: Docker-Socket
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - SERVICES=1
      - TASKS=1
      - EXEC=1
      - EVENTS=1
      - INFO=1
      - NETWORKS=1
      - VOLUMES=1
      - POST=0
    expose:
      - "2375"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2375/version"]
      interval: 30s
      timeout: 5s
      retries: 3

  traefik:
    container_name: Traefik
    image: traefik:v3
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8180:8080"
    volumes:
      - ./App-Data/Traefik:/etc/traefik
      - ./App-Data/Traefik/cache:/etc/traefik/cache
      - ./App-Data/Traefik/custom_routes:/etc/traefik/custom_routes
      - ./App-Data/Traefik/traefik.yml:/etc/traefik/traefik.yml
      - ./App-Data/Traefik/acme.json:/etc/traefik/acme.json
    environment:
      - TZ=UTC
      - DOCKER_HOST=tcp://Docker-Socket:2375
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    networks:
      - default
      - proxy
    labels:
      - traefik.enable=true
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  authelia:
    container_name: Authelia
    image: authelia/authelia:latest
    restart: unless-stopped
    environment:
      - TZ=UTC
    volumes:
      - ./App-Data/Authelia/config:/config
    ports:
      - "9091:9091"
    expose:
      - 9091
    networks:
      - default
      - proxy
    depends_on:
      authelia-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9091/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  authelia-redis:
    container_name: Authelia-Redis
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - ./App-Data/Authelia/redis:/data
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
networks:
  proxy:
    name: proxy
    driver: bridge
