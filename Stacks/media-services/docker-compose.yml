services:
  media:
    container_name: skeleton-media
    image: nginx:alpine
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
    ports:
      - "8081:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  seerr:
    container_name: Seerr
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    restart: unless-stopped
    environment:
      - TZ=UTC
      - PORT=5055
      - LOG_LEVEL=info
    volumes:
      - ./App-Data/Seerr/config:/app/config
    ports:
      - "5055:5055"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5055/api/v1/status || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

  tautulli:
    container_name: Tautulli
    image: lscr.io/linuxserver/tautulli:latest
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    volumes:
      - ./App-Data/Tautulli/config:/config
    ports:
      - "8181:8181"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8181/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  wizarr:
    container_name: Wizarr
    image: ghcr.io/wizarrrr/wizarr:latest
    restart: unless-stopped
    environment:
      - TZ=UTC
      - APP_URL=http://localhost:5690
    volumes:
      - ./App-Data/Wizarr/data:/data/database
    ports:
      - "5690:5690"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5690/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
networks:
  proxy:
    name: proxy
    external: true
