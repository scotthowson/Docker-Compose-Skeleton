services:
  comms:
    container_name: skeleton-comms
    image: alpine:latest
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
    command: >
      sh -c 'while true; do
        echo "[$$( date )] Heartbeat — communication-collaboration stack is alive";
        sleep 60;
      done'
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 5s
      retries: 3

  privatebin:
    container_name: PrivateBin
    image: privatebin/nginx-fpm-alpine:latest
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    volumes:
      - ./App-Data/PrivateBin/data:/srv/data
    ports:
      - "8888:8080"
    mem_limit: 150M
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
      - proxy
networks:
  proxy:
    name: proxy
    external: true
