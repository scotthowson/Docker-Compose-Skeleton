services:
  docker-socket-proxy:
    container_name: Docker-Socket
    image: tecnativa/docker-socket-proxy:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - SERVICES=1
      - TASKS=1
      - EXEC=1
      - EVENTS=1
      - INFO=1
      - NETWORKS=1
      - VOLUMES=1
      - POST=0
    ports:
      - "2375:2375"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:2375/version"]
      interval: 30s
      timeout: 5s
      retries: 3

  traefik:
    container_name: Traefik
    image: traefik:v3
    ports:
      - "${TRAEFIK_PORT_HTTP:-80}:80"
      - "${TRAEFIK_PORT_HTTPS:-443}:443"
      - "${TRAEFIK_PORT_DASHBOARD:-8080}:8080"
    volumes:
      - ${APP_DATA_DIR:-./App-Data}/Traefik:/etc/traefik
      - ${APP_DATA_DIR:-./App-Data}/Traefik/acme.json:/etc/traefik/acme.json
    environment:
      - TZ=${TZ:-UTC}
      - DOCKER_HOST=tcp://Docker-Socket:2375
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN:-}
    labels:
      - traefik.enable=true
    restart: unless-stopped
    depends_on:
      - docker-socket-proxy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
